<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculatrice</title>
    <link rel="stylesheet" href="style.css" />
    <script src="style.js" defer></script>
  </head>
  <body>
    <div class="calculatrice">
      <div class="ecran"></div>
      <div class="touches">
        <button data-cle="8" class="bouton">C</button>
        <button data-cle="53" class="bouton">(</button>
        <button data-cle="219" class="bouton">)</button>
        <button data-cle="111" class="bouton">/</button>
        <button data-cle="103" class="bouton">7</button>
        <button data-cle="104" class="bouton">8</button>
        <button data-cle="105" class="bouton">9</button>
        <button data-cle="106" class="bouton">*</button>
        <button data-cle="100" class="bouton">4</button>
        <button data-cle="101" class="bouton">5</button>
        <button data-cle="102" class="bouton">6</button>
        <button data-cle="109" class="bouton">-</button>
        <button data-cle="97" class="bouton">1</button>
        <button data-cle="98" class="bouton">2</button>
        <button data-cle="99" class="bouton">3</button>
        <button data-cle="107" class="bouton">+</button>
        <button data-cle="96" class="bouton">0</button>
        <button data-cle="110" class="bouton">.</button>
        <button data-cle="13" class="bouton">=</button>
      </div>
    </div>
  </body>
</html>
